<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stacked PRs for GitHub preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/primitives@10.3.4/dist/css/functional/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/primitives@10.3.4/dist/css/functional/themes/dark.css" />
    <link rel="stylesheet" href="../src/content/styles.css" />
    <style>
      body { margin: 0; background: var(--bgColor-default); color: var(--fgColor-default); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
      .top { display: flex; align-items: center; gap: 8px; padding: 14px 32px 6px; background: var(--bgColor-inset); }
      .repo { font-size: 16px; }
      .repo strong { font-weight: 600; }
      .tabs { display: flex; gap: 20px; padding: 0 32px; background: var(--bgColor-inset); border-bottom: 1px solid var(--borderColor-default); }
      .tabs span { padding: 8px 2px; color: var(--fgColor-muted); }
      .tabs span.selected { color: var(--fgColor-default); font-weight: 600; box-shadow: inset 0 -2px 0 #fd8c73; }
      .page { max-width: 1216px; margin: 0 auto; padding: 24px 32px; }
      .search { display: block; height: 32px; width: 100%; box-sizing: border-box; margin-bottom: 16px; padding: 0 12px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-default); color: inherit; font: inherit; }
      .box { border: 1px solid var(--borderColor-default); border-radius: 6px; overflow: hidden; }
      .box-header { display: flex; gap: 16px; padding: 12px 16px; background: var(--bgColor-muted); }
      .muted { color: var(--fgColor-muted); }
      .repo-title { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--borderColor-muted); font-size: 20px; }
      .repo-avatar { width: 24px; height: 24px; border-radius: 6px; background: #d4c5f9; }
      .visibility { padding: 0 7px; border: 1px solid var(--borderColor-default); border-radius: 2em; color: var(--fgColor-muted); font-size: 12px; }
      .repo-home { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 24px; }
      .repo-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .repo-spacer { flex: 1; }
      .repo-button { height: 32px; padding: 0 12px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-muted); color: inherit; font: inherit; }
      .repo-code { border-color: #1f883d; background: #1f883d; color: #fff; font-weight: 600; }
      .repo-goto { display: inline-flex; align-items: center; gap: 24px; height: 30px; padding: 0 8px 0 12px; border: 1px solid var(--borderColor-default); border-radius: 6px; color: var(--fgColor-muted); }
      .repo-goto kbd { padding: 0 5px; border: 1px solid var(--borderColor-default); border-radius: 4px; font-size: 11px; }
      .box-header[data-testid] { gap: 10px; }
      .repo-file { display: grid; grid-template-columns: 20px 200px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--borderColor-muted); }
      .repo-file-icon { width: 16px; height: 14px; border-radius: 2px; background: #54aeff; }
      .repo-file-icon.file { width: 12px; height: 15px; background: none; border: 1.5px solid var(--fgColor-muted); }
      .repo-file-message { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .repo-about h2 { margin: 0 0 8px; font-size: 16px; }
      .repo-about p { margin: 0 0 20px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .native { margin: 0; padding: 0; list-style: none; }
      .native li { padding: 8px 16px; border-top: 1px solid var(--borderColor-muted); }
      .pull-title { margin: 0 0 8px; font-size: 32px; font-weight: 400; }
      .pull-title span { color: var(--fgColor-muted); font-weight: 300; }
      .state { display: inline-block; padding: 5px 12px; border-radius: 2em; background: #1f883d; color: #fff; font-weight: 500; margin-right: 8px; }
      .placeholder { height: 12px; margin: 16px; border-radius: 6px; background: var(--bgColor-neutral-muted); }
      .placeholder:nth-child(3n) { width: 60%; }
      .placeholder:nth-child(4n) { width: 80%; }
      #log:empty { display: none; }
    </style>
  </head>
  <body>
    <div class="top"><span class="repo"><span id="owner"></span> / <strong id="repository"></strong></span></div>
    <div class="tabs" id="tabs"><span>Code</span><span>Issues</span><span>Pull requests</span><span>Actions</span><span>Insights</span></div>
    <div class="page" id="page"></div>
    <pre id="log"></pre>
    <script>
      for (const level of ['warn', 'error']) {
        const original = console[level];
        console[level] = (...values) => {
          document.getElementById('log').textContent += `${level}: ${values.map((value) => (value && value.stack) || String(value)).join(' ')}\n`;
          original(...values);
        };
      }
      window.addEventListener('error', (event) => console.error(event.error || event.message));
      window.addEventListener('unhandledrejection', (event) => console.error(event.reason));
    </script>
    <script src="demo.js"></script>
    <script>
      // ?demo uses dev/demo.js; otherwise ?host=&repo= reads live data through dev/server.js.
      // ?q= search (the extension keeps it in sync), ?issues the issue list, ?pr= pull request page, ?expand=stack-208,stack-215, ?theme=dark,
      // ?hover=<selector> hovers that element after loading (to show the what-changed popover),
      // ?type=<text> types into the search after loading (to show its suggestions).
      const parameters = new URLSearchParams(location.search);
      const demo = parameters.has('demo');
      const host = demo ? 'github.com' : parameters.get('host') || 'github.com';
      const [owner, repository] = (demo ? 'acme/storefront' : parameters.get('repo') || 'owner/repository').split('/');
      const number = parameters.get('pr');
      const issues = parameters.has('issues');
      const home = parameters.has('home');
      document.getElementById('tabs').children[home ? 0 : issues ? 1 : 2].classList.add('selected');
      const theme = parameters.get('theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-color-mode', theme);
      document.documentElement.setAttribute(`data-${theme}-theme`, theme);
      document.getElementById('owner').textContent = owner;
      document.getElementById('repository').textContent = repository;

      const page = document.getElementById('page');
      if (home) {
        // A repository's main page: branch picker, latest commit and files, with the About column beside them.
        const files = [
          ['dir', '.github', '[infra] Cache build layers between CI runs', '2 days ago'],
          ['dir', 'checkout', '[checkout] Add the cart totals service', '3 hours ago'],
          ['dir', 'search', '[search] Index product variants', 'yesterday'],
          ['dir', 'storefront', '[ui] Dark mode for the account menu', '5 hours ago'],
          ['dir', 'docs', '[docs] Explain the release checklist step by step', '1 hour ago'],
          ['file', '.gitignore', 'Ignore local build output', 'last month'],
          ['file', 'package.json', '[deps] Bump the image pipeline to v4', 'yesterday'],
          ['file', 'README.md', '[docs] Explain the release checklist step by step', '1 hour ago'],
        ];
        page.innerHTML = `
          <div class="repo-title"><span class="repo-avatar"></span><strong>storefront</strong><span class="visibility">Internal</span></div>
          <div class="repo-home">
            <div class="repo-main">
              <div class="repo-toolbar">
                <button id="ref-picker-repos-header-ref-selector" class="repo-button">⑂ <strong>main</strong> ▾</button>
                <span class="muted">⑂ <strong>14</strong> Branches · <strong>3</strong> Tags</span>
                <span class="repo-spacer"></span>
                <span class="repo-goto">Go to file <kbd>t</kbd></span>
                <button class="repo-button">Add file ▾</button>
                <button class="repo-button repo-code">‹› Code ▾</button>
              </div>
              <div class="box">
                <div class="box-header" data-testid="latest-commit-details"><strong>mira-chen</strong><span class="muted">[checkout] Add the cart totals service</span><span class="repo-spacer"></span><span class="muted">3f9c2a1 · 3 hours ago · 1,284 Commits</span></div>
                <div data-testid="directory-content">${files.map(([kind, name, message, when]) => `<div class="repo-file"><span class="repo-file-icon ${kind}"></span><span class="repo-file-name">${name}</span><span class="muted repo-file-message">${message}</span><span class="muted">${when}</span></div>`).join('')}</div>
              </div>
            </div>
            <aside class="repo-about"><h2>About</h2><p>The Acme storefront: catalog, search, cart and checkout.</p><p class="muted">☆ 41 stars · 6 watching · 9 forks</p><h2>Releases</h2><p class="muted">v2.14.0 · last week</p><h2>Contributors</h2><p class="muted">mira-chen, sam-okafor, devon-reyes, priya-nair, lee-park</p></aside>
          </div>`;
      } else if (number) {
        page.innerHTML = `
          <h1 class="pull-title"></h1>
          <p><span class="state">Open</span><span class="muted" id="subtitle"></span></p>
          <div class="box"><div class="box-header"><strong>Conversation</strong><span class="muted">Commits</span><span class="muted">Checks</span><span class="muted">Files changed</span></div>
          <div>${'<div class="placeholder"></div>'.repeat(16)}</div></div>`;
        page.querySelector('.pull-title').textContent = demo ? '[checkout] Apply discount codes at the totals step ' : 'Pull request ';
        page.querySelector('.pull-title').append(Object.assign(document.createElement('span'), { textContent: `#${number}` }));
        if (demo) page.querySelector('#subtitle').textContent = 'mira-chen wants to merge 3 commits into mira/shipping-rates from mira/discount-codes';
      } else {
        page.innerHTML = `
          <div role="search" aria-label="Pull requests"><input class="search" id="search" /></div>
          <div class="box"><h2 class="sr-only">Pull requests</h2><div class="box-header"><strong>Open</strong><span class="muted">Closed</span></div><ul class="native" id="native"></ul></div>`;
        page.querySelector('#search').value = parameters.get('q') || (issues ? 'is:issue is:open' : 'is:pr is:open');
        for (const link of (parameters.get('rows') || '201,202').split(',')) {
          const item = document.createElement('li');
          const anchor = Object.assign(document.createElement('a'), { href: `https://${host}/${owner}/${repository}/${issues ? 'issues' : 'pull'}/${link}`, textContent: `Native row #${link}` });
          item.append(anchor);
          document.getElementById('native').append(item);
        }
      }

      const storage = new Map();
      const area = {
        async get(keys) {
          const result = {};
          for (const key of [].concat(keys)) if (storage.has(key)) result[key] = storage.get(key);
          return result;
        },
        async set(values) {
          for (const [key, value] of Object.entries(values)) storage.set(key, value);
        },
      };
      if (parameters.get('expand')) storage.set('expandedStacks', parameters.get('expand').split(',').map((key) => `${host}/${owner}/${repository}:${key}`));
      if (demo) {
        storage.set('settings', { timeZone: 'America/New_York' });
        Date.now = () => GitHubStacksDemo.now;
      }
      window.chrome = {
        runtime: {
          id: 'preview',
          async sendMessage(message) {
            if (demo) return { ok: true, data: GitHubStacksDemo.answer(message) };
            const response = await fetch('/message', { method: 'POST', body: JSON.stringify(message) });
            return response.json();
          },
        },
        storage: { local: area, sync: area, onChanged: { addListener() {} } },
      };
      if (parameters.get('hover')) {
        const hoverWhenReady = (attempts) => {
          const target = document.querySelector(parameters.get('hover'));
          if (target) target.dispatchEvent(new MouseEvent('mouseenter'));
          else if (attempts > 0) setTimeout(() => hoverWhenReady(attempts - 1), 200);
        };
        hoverWhenReady(50);
      }
      if (parameters.get('type') !== null) {
        // Types once the search shows, which is after the demo data loads.
        const typeOnce = new MutationObserver(() => {
          const input = document.querySelector(home ? '.ghs-code-search-input' : '.ghs-search-input');
          if (!input || !input.offsetParent) return;
          typeOnce.disconnect();
          input.focus();
          input.value = parameters.get('type');
          input.dispatchEvent(new Event('input', { bubbles: true }));
        });
        typeOnce.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
      }
      globalThis.GitHubStacks = {
        testLocation: { host, pathname: home ? `/${owner}/${repository}` : number ? `/${owner}/${repository}/pull/${number}` : `/${owner}/${repository}/${issues ? 'issues' : 'pulls'}` },
      };
    </script>
    <script src="../src/shared/work-hours.js"></script>
    <script src="../src/shared/review-status.js"></script>
    <script src="../src/shared/stacks.js"></script>
    <script src="../src/shared/activity.js"></script>
    <script src="../src/shared/search.js"></script>
    <script src="../src/shared/code-search.js"></script>
    <script src="../src/content/octicons.js"></script>
    <script src="../src/content/api.js"></script>
    <script src="../src/content/render.js"></script>
    <script src="../src/content/activity-popover.js"></script>
    <script src="../src/content/search-bar.js"></script>
    <script src="../src/content/list-view.js"></script>
    <script src="../src/content/issue-view.js"></script>
    <script src="../src/content/stack-navigator.js"></script>
    <script src="../src/content/code-search-bar.js"></script>
    <script src="../src/content/main.js"></script>
  </body>
</html>
